<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fc5102">
  <title>Sem conexão - TGT Agenda</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; background: #fff5ef; color: #2a2a2a; padding: 24px; box-sizing: border-box; text-align: center; }
    .card { background: #fff; border: 1px solid #ffd9c5; border-radius: 18px; padding: 28px 22px; max-width: 380px; box-shadow: 0 10px 24px rgba(0,0,0,.05); }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #6b6b6b; line-height: 1.5; margin: 0 0 20px; }
    button { background: #fc5102; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon-192.png" alt="TGT Agenda">
    <h1>Sem conexão com a internet</h1>
    <p>O sistema precisa de internet para mostrar a agenda atualizada. Verifique o Wi-Fi ou os dados móveis e tente de novo.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
